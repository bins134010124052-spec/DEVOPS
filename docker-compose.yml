services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: devops-node-app
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      NODE_ENV: production
      DB_PATH: /app/data/app.db
      LOG_LEVEL: info
    volumes:
      - app-data:/app/data
    restart: unless-stopped

volumes:
  app-data:
