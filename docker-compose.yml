services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: devops-node-app
    ports:
      - "${PORT:-3001}:${PORT:-3001}"
    environment:
      PORT: ${PORT:-3001}
      NODE_ENV: ${NODE_ENV:-production}
      DB_PATH: ${DB_PATH:-/app/data/app.db}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - app-data:/app/data
    restart: unless-stopped

volumes:
  app-data:
